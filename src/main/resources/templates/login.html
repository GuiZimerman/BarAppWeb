<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>BarAppWeb - Login</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
        <link rel="stylesheet" th:href="@{/css/style.css}" /> 
    </head>
    <body>
        <header>
            <nav class="navbar navbar-light shadow rounded" style="background-color: #d2d9de;">
                <div class="container d-flex justify-content-center">
                    <a class="navbar-brand h1 mx-3 my-2" href="#" style="font-size: 3rem;">BarAppWeb</a>
                </div>
            </nav>
        </header>
        <main class="container mt-5 p-4 bg-light shadow rounded col-md-8">
            <h1 class="text-center mb-4">Login</h1>

            <form id="loginForm" th:action="@{/login/valida}" method="post">
                <div class="mb-3 d-flex justify-content-center">
                    <div class="col-md-4 p-2"> <!-- Define o tamanho e centraliza -->
                        <label for="login" class="form-label">Login</label>
                        <input type="text" class="form-control" id="txtLogin" name="login" placeholder="Digite seu login" required>
                    </div>
                </div>

                <div class="mb-3 d-flex justify-content-center">
                    <div class="col-md-4 p-2"> <!-- Define o tamanho e centraliza -->
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="txtSenha" name="senha" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-2">
                    <button type="submit" class="btn btn-primary m-1">Login</button>
                </div>
            </form>
        </main>
        
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script> 
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
